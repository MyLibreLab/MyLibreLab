name: Build and Release

on:
  push:
    branches: [ master, main, dev, fix/windows-build-compatibility ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, dev ]

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            executable-suffix: ''
            archive-format: tar.gz
          - os: windows-latest
            platform: windows
            arch: x64
            executable-suffix: .exe
            archive-format: zip
          - os: macos-latest
            platform: macos
            arch: x64
            executable-suffix: ''
            archive-format: tar.gz

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          architecture: ${{ matrix.arch }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build application
        run: ./gradlew clean build -PskipAutostyle -PskipSonarlint -x test --no-daemon

      - name: Create portable app structure
        shell: bash
        run: |
          # Use the new createPortableApp task
          ./gradlew :mylibrelab-application:createPortableApp --no-daemon

          # Move the portable app to expected location for packaging
          mkdir -p build/jpackage
          mv application/build/portable build/jpackage/MyLibreLab

          # Copy elements directory to the portable app
          cp -r elements build/jpackage/MyLibreLab/

          cd build/jpackage/MyLibreLab

          # Ensure launchers are executable on Unix
          chmod +x MyLibreLab.sh

          # Create macOS launcher
          cp MyLibreLab.sh MyLibreLab.command
          chmod +x MyLibreLab.command

          cd ../../..

      - name: Verify portable app structure
        shell: bash
        run: |
          echo "Contents of build directory:"
          ls -la build/ 2>/dev/null || (echo "build directory not found" && exit 1)
          echo "Contents of jpackage directory:"
          ls -la build/jpackage/ 2>/dev/null || (echo "jpackage directory not found" && exit 1)
          echo "Contents of MyLibreLab app:"
          ls -la build/jpackage/MyLibreLab/ 2>/dev/null || (echo "MyLibreLab directory not found" && exit 1)

      # Use PowerShell on real Windows runners
      - name: Package portable binary (Windows)
        if: matrix.platform == 'windows' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/jpackage
          Compress-Archive -Path MyLibreLab\* -DestinationPath ..\..\MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip
          cd ..\..
          echo "ARTIFACT_PATH=MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Verify archive was created
          if (-not (Test-Path "MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip")) {
            Write-Error "Archive not created"
            exit 1
          }

          Get-ChildItem "MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      # Fallback for act (Linux container simulating Windows)
      - name: Package portable binary (Windows, act fallback)
        if: matrix.platform == 'windows' && runner.os != 'Windows'
        shell: bash
        run: |
          cd build/jpackage
          zip -r ../../MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip MyLibreLab/
          cd ../..
          echo "ARTIFACT_PATH=MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip" >> $GITHUB_ENV

          # Verify archive was created
          if [ ! -f "MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip" ]; then
            echo "Error: Archive not created"
            exit 1
          fi

          ls -la "MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      # Unix platforms (Linux/macOS)
      - name: Package portable binary (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd build/jpackage
          tar -czf ../../MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz MyLibreLab/
          cd ../..
          echo "ARTIFACT_PATH=MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" >> $GITHUB_ENV

          # Verify archive was created
          if [ ! -f "MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" ]; then
            echo "Error: Archive not created"
            exit 1
          fi

          ls -la "MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: MyLibreLab-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 30

      - name: Build application
        run: ./gradlew clean build -PskipAutostyle -PskipSonarlint -x test --no-daemon

      - name: Stop Gradle daemon (Windows)
        if: matrix.platform == 'windows'
        run: ./gradlew --stop
        continue-on-error: true

  create-release:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog

      - name: Extract version from gradle.properties
        shell: bash
        run: |
          VERSION=$(grep -E '^\s*MyLibreLab\.version\s*=' gradle.properties | sed 's/.*=\s*//; s/\s*$//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Generate changelog
        shell: bash
        run: |
          git fetch --tags --force

          # Get previous tag
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD~1 2>/dev/null || echo "")

          if [ -n "$prev" ]; then
            echo "## MyLibreLab v$VERSION - Changes since $prev" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:'- %s (%h)' "$prev"..HEAD >> CHANGELOG.md
          else
            echo "## MyLibreLab v$VERSION - Initial Release" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "First MyLibreLab release featuring:" >> CHANGELOG.md
            echo "- Self-contained executables with bundled Java 17 runtime" >> CHANGELOG.md
            echo "- Cross-platform support (Windows, Linux, macOS)" >> CHANGELOG.md
            echo "- Modern CI/CD pipeline with automated builds" >> CHANGELOG.md
            echo "- Updated dependencies and security improvements" >> CHANGELOG.md
            echo "- No external Java installation required" >> CHANGELOG.md
          fi

          # Add download instructions
          cat >> CHANGELOG.md << 'EOF'

          ## Downloads

          **Choose the right package for your platform:**

          - 🪟 **Windows**: `MyLibreLab-windows-x64.zip` (~96MB)
          - 🐧 **Linux**: `MyLibreLab-linux-x64.tar.gz` (~96MB)
          - 🍎 **macOS**: `MyLibreLab-macos-x64.tar.gz` (~96MB)

          All packages include a bundled Java runtime - **no separate Java installation required**.

          ### How to run:
          - **Windows**: Extract and run `MyLibreLab.bat`
          - **Linux/macOS**: Extract and run `./MyLibreLab.sh` (or `./MyLibreLab.command` on macOS)

          ### What's included:
          - Complete MyLibreLab application with modern UI
          - Legacy MyOpenLab compatibility layer
          - All circuit elements and component libraries
          - Hardware driver support (RS232, K8047, K8055, etc.)
          - Custom Java 17 runtime (no system Java needed)
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          files: |
            artifacts/MyLibreLab-linux-x64/*
            artifacts/MyLibreLab-windows-x64/*
            artifacts/MyLibreLab-macos-x64/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
