name: Release

on:
  push:
    branches:
      - feature/github-actions-release
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jpackage dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: List jpackage output
        run: |
          echo "Contents of application/build/jpackage:"
          find application/build/jpackage -type f | head -20
          echo "Directory structure:"
          ls -la application/build/jpackage/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-linux
          path: |
            application/build/jpackage/*.deb
            application/build/jpackage/*.tar.gz
            application/build/jpackage/
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clear corrupted Gradle cache
        run: |
          if (Test-Path "$env:USERPROFILE\.gradle\caches") {
            Remove-Item -Recurse -Force "$env:USERPROFILE\.gradle\caches" -ErrorAction SilentlyContinue
          }
        shell: powershell

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}-v2
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace --no-daemon
        shell: bash

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace --no-daemon
        shell: bash

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace --no-daemon
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-windows
          path: |
            application/build/jpackage/*.exe
            application/build/jpackage/*.msi
            application/build/jpackage/
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: List jpackage output
        run: |
          echo "Contents of application/build/jpackage:"
          find application/build/jpackage -type f | head -20
          echo "Directory structure:"
          ls -la application/build/jpackage/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-macos
          path: |
            application/build/jpackage/*.pkg
            application/build/jpackage/*.dmg
            application/build/jpackage/
          if-no-files-found: warn

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: List jpackage output
        run: |
          echo "Contents of application/build/jpackage:"
          find application/build/jpackage -type f | head -20
          echo "Directory structure:"
          ls -la application/build/jpackage/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-macos-arm64
          path: |
            application/build/jpackage/*.pkg
            application/build/jpackage/*.dmg
            application/build/jpackage/
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-macos-arm64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List ALL downloaded artifacts in detail
        run: |
          echo "=== COMPLETE ARTIFACT STRUCTURE ==="
          find artifacts -type f -ls
          echo ""
          echo "=== FILE TYPES FOUND ==="
          find artifacts -type f -exec file {} \;
          echo ""
          echo "=== EXECUTABLES FOUND ==="
          find artifacts -type f -executable
          echo ""
          echo "=== APP IMAGES/BUNDLES FOUND ==="
          find artifacts -name "*.app" -o -name "*.AppImage"

      - name: Prepare release assets with diagnostics
        run: |
          mkdir -p release-assets
          
          echo "=== LOOKING FOR INSTALLER FILES ==="
          # Look for various installer types
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          
          echo "=== LOOKING FOR APPLICATION BUNDLES ==="
          # Look for app bundles and AppImages
          find artifacts -name "*.app" -type d -exec tar -czf "release-assets/{}.tar.gz" {} \;
          find artifacts -name "*.AppImage" -type f -exec cp {} release-assets/ \;
          
          echo "=== LOOKING FOR EXECUTABLE FILES ==="
          # Look for executable files that might be standalone apps
          find artifacts -type f -executable ! -name "*.sh" ! -name "*.bat" -exec bash -c '
            file "$1" | grep -q "executable" && cp "$1" "release-assets/$(basename "$1")"
          ' _ {} \;
          
          echo "=== CURRENT RELEASE ASSETS ==="
          ls -la release-assets/ || echo "No release assets found"

      - name: Generate checksums
        run: |
          cd release-assets
          if [ "$(ls -A .)" ]; then
            for file in *; do
              if [ -f "$file" ] && [[ ! "$file" == *.sha256 ]]; then
                echo "Generating checksum for: $file"
                sha256sum "$file" > "$file.sha256"
              fi
            done
            echo "Final release assets:"
            ls -la
          else
            echo "No files to generate checksums for"
          fi

      - name: Create Release
        if: hashFiles('release-assets/*') != ''
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          name: MyLibreLab Release ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false