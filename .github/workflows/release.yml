name: Release

on:
  push:
    branches:
      - feature/github-actions-release
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install jpackage dependencies
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-linux
          path: |
            application/build/jpackage/*.deb
            application/build/jpackage/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clear corrupted Gradle cache
        run: |
          if (Test-Path "$env:USERPROFILE\.gradle\caches") {
            Remove-Item -Recurse -Force "$env:USERPROFILE\.gradle\caches" -ErrorAction SilentlyContinue
          }
        shell: powershell

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}-v2
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace --no-daemon
        shell: bash

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace --no-daemon
        shell: bash

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace --no-daemon
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-windows
          path: |
            application/build/jpackage/*.exe
            application/build/jpackage/*.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-macos
          path: |
            application/build/jpackage/*.pkg
            application/build/jpackage/*.dmg

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build dependencies first
        run: ./gradlew build -x test -x kaptTestKotlin -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build runtime image
        run: ./gradlew :mylibrelab-application:runtimeZip -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Build installer
        run: ./gradlew :mylibrelab-application:jpackage -PskipAutostyle -PskipSonarlint --info --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mylibrelab-macos-arm64
          path: |
            application/build/jpackage/*.pkg
            application/build/jpackage/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-macos-arm64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts structure:"
          find artifacts -type f -name "*" 
          echo "Total files found:"
          find artifacts -type f | wc -l

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Only copy installer files, not all the jpackage contents
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.pkg" -o -name "*.dmg" -o -name "*.tar.gz" \) -exec cp {} release-assets/ \;
          
          # Rename files to include platform info
          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              case "$file" in
                *.exe|*.msi) mv "$file" "MyLibreLab-windows-${file}" ;;
                *.deb|*.tar.gz) mv "$file" "MyLibreLab-linux-${file}" ;;
                *.pkg|*.dmg) 
                  if [[ "$PWD" == *"arm64"* ]]; then
                    mv "$file" "MyLibreLab-macos-arm64-${file}"
                  else
                    mv "$file" "MyLibreLab-macos-${file}"
                  fi ;;
              esac
            fi
          done
          
          echo "Files to be released:"
          ls -la

      - name: Generate checksums
        run: |
          cd release-assets
          for file in MyLibreLab-*; do
            if [ -f "$file" ] && [[ ! "$file" == *.sha256 ]]; then
              echo "Generating checksum for: $file"
              sha256sum "$file" > "$file.sha256"
            fi
          done
          echo "Final release assets:"
          ls -la

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ github.run_number }}
          name: MyLibreLab Release ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/MyLibreLab-*
          fail_on_unmatched_files: true