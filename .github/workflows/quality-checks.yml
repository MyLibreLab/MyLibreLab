name: Quality Checks

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

env:
  JAVA_VERSION: '17'
  SKIP_TESTS: 'true'  # Temporarily disable tests

jobs:
  code-style:
    runs-on: ubuntu-latest
    name: Code Style Check

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Autostyle check
        run: ./gradlew autostyleCheck -x test

      - name: Run SonarLint (local analysis only)
        run: ./gradlew sonarlintMain || echo "SonarLint check completed"

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'  # Don't fail on vulnerabilities for now
