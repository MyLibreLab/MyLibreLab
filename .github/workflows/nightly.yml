name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC daily
  workflow_dispatch:
  push:
    branches: [test/workflow-improvements] # Add this for testing

env:
  JAVA_VERSION: "17"

jobs:
  nightly:
    name: Nightly (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate nightly version
        shell: bash
        run: |
          VERSION=$(date +%Y%m%d)-$(git rev-parse --short HEAD)
          echo "NIGHTLY_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build nightly
        run: ./gradlew clean build -PskipAutostyle -PskipSonarlint -x test

      - name: Create portable app
        run: ./gradlew :mylibrelab-application:createPortableApp

      - name: Package nightly (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path application/build/portable/* -DestinationPath MyLibreLab-nightly-${{ matrix.platform }}-${{ env.NIGHTLY_VERSION }}.zip

      - name: Package nightly (Unix)
        if: matrix.platform != 'windows'
        run: |
          tar -czf MyLibreLab-nightly-${{ matrix.platform }}-${{ env.NIGHTLY_VERSION }}.tar.gz -C application/build portable

      - name: Upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: MyLibreLab-nightly-${{ matrix.platform }}-${{ env.NIGHTLY_VERSION }}
          path: MyLibreLab-nightly-${{ matrix.platform }}-${{ env.NIGHTLY_VERSION }}.*
          retention-days: 7
